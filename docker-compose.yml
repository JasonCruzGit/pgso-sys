services:
  postgres:
    image: postgres:16-alpine
    container_name: inv-pgp-postgres
    restart: unless-stopped
    mem_limit: 256m
    environment:
      POSTGRES_DB: ${DB_DATABASE:-inv_pgp_gso}
      POSTGRES_USER: ${DB_USERNAME:-gso_admin}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-gso_secret_change_me}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/backup:/backup
    ports:
      - "5435:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-gso_admin} -d ${DB_DATABASE:-inv_pgp_gso}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: ../docker/Dockerfile.backend
    container_name: inv-pgp-backend
    restart: unless-stopped
    mem_limit: 512m
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      APP_NAME: "PGP PGSO Inventory"
      APP_ENV: ${APP_ENV:-production}
      APP_KEY: ${APP_KEY}
      APP_DEBUG: ${APP_DEBUG:-false}
      APP_URL: ${APP_URL:-http://localhost:8000}
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE:-inv_pgp_gso}
      DB_USERNAME: ${DB_USERNAME:-gso_admin}
      DB_PASSWORD: ${DB_PASSWORD:-gso_secret_change_me}
      JWT_SECRET: ${JWT_SECRET}
      JWT_TTL: ${JWT_TTL:-60}
      JWT_REFRESH_TTL: ${JWT_REFRESH_TTL:-20160}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      OPENAI_MAX_TOKENS: ${OPENAI_MAX_TOKENS:-2048}
      OPENAI_TIMEOUT: ${OPENAI_TIMEOUT:-30}
      AI_RATE_LIMIT_CHAT: ${AI_RATE_LIMIT_CHAT:-20}
      AI_CACHE_TTL: ${AI_CACHE_TTL:-300}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
      SESSION_LIFETIME: ${SESSION_LIFETIME:-120}
      HASH_DRIVER: argon2id
    volumes:
      - backend_storage:/var/www/html/storage/app
      - ./backend:/var/www/html
    ports:
      - "8001:8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: ../docker/Dockerfile.frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-/api}
        VITE_PUBLIC_URL: ${VITE_PUBLIC_URL:-}
    container_name: inv-pgp-frontend
    restart: unless-stopped
    mem_limit: 128m
    depends_on:
      - backend
    ports:
      - "5173:80"

  backup:
    image: postgres:16-alpine
    container_name: inv-pgp-backup
    mem_limit: 128m
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGPASSWORD: ${DB_PASSWORD:-gso_secret_change_me}
      DB_USERNAME: ${DB_USERNAME:-gso_admin}
      DB_DATABASE: ${DB_DATABASE:-inv_pgp_gso}
    volumes:
      - ./docker/backup:/backup
      - ./docker/scripts/backup.sh:/backup.sh:ro
    entrypoint: ["/bin/sh", "-c", "while true; do /backup.sh; sleep 86400; done"]

volumes:
  postgres_data:
  backend_storage:
